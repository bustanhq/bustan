# The path lists and check names here must match .github/workflows/ci.yml exactly.
# When a hook and CI disagree, a contributor's clean tree is not a green build.

pre-commit:
  jobs:
    # Runs alone and first: every `uv run` below re-locks the project as a side
    # effect, so a stale lockfile repairs itself before a parallel job can see it.
    - name: lock
      run: uv lock --check

    - name: checks
      group:
        parallel: true
        jobs:
          - name: ruff-format
            run: uv run ruff format --check .
          - name: ruff
            run: uv run ruff check .
          - name: ty
            run: uv run ty check src tests scripts
          - name: api-ref
            run: uv run python scripts/generate_api_reference.py

commit-msg:
  # A rebase rewrites messages that were already accepted, and a merge subject is
  # generated by git rather than typed by the author.
  skip:
    - merge
    - rebase
  jobs:
    - name: conventional-commit
      run: |
        subject=$(head -n 1 "{1}")
        case "$subject" in
          Merge\ *|Revert\ *|fixup!\ *|squash!\ *|amend!\ *)
            exit 0
            ;;
        esac
        pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()[:space:]]+\))?!?: .+'
        if printf '%s\n' "$subject" | grep -Eq "$pattern"; then
          exit 0
        fi
        echo "Commit message rejected: the subject is not a Conventional Commit." >&2
        echo >&2
        echo "  got:      $subject" >&2
        echo "  expected: type(optional-scope)!: summary" >&2
        echo "  types:    build chore ci docs feat fix perf refactor revert style test" >&2
        echo >&2
        echo "Example: feat(ioc): reject a request-scoped provider in a default-scope controller" >&2
        exit 1

pre-push:
  jobs:
    - name: coverage
      run: uv run --group dev python -m pytest --cov=bustan --cov-report=term-missing --cov-fail-under=85
    - name: coverage-core
      run: uv run --group dev python -m pytest --cov=bustan.core --cov-report=term-missing --cov-fail-under=85
    - name: markdown-links
      run: uv run python scripts/check_markdown_links.py
    - name: examples
      run: uv run python scripts/run_examples.py
    - name: package-verification
      run: uv run python scripts/package_smoke_check.py
