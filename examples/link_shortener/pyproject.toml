[project]
name = "link_shortener"
version = "0.1.0"
description = "Bustan example: the link shortener the tutorial series builds"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["bustan[starlette]", "pydantic>=2.0"]

[project.scripts]
start = "link_shortener:main"
dev = "link_shortener:dev"

[dependency-groups]
dev = ["pytest>=9.0.3,<10.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
bustan = { path = "../..", editable = true }
