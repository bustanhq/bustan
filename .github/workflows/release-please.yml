name: Release Please

on:
  push:
    branches:
      # This file lives on the 1.1 maintenance branch, which releases itself.
      # It is deliberately not the same as the copy on the development line.
      - release/1.1.1

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release/config.json
          manifest-file: release/manifest.json
          # Without this the action would propose a release from the default
          # branch rather than from the branch that triggered it.
          target-branch: release/1.1.1

      - name: Check out repository
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Set up Python
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: uv sync --group dev --frozen

      - name: Validate release artifacts
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          uv run python scripts/generate_api_reference.py --check
          uv run python scripts/check_markdown_links.py
          uv run ruff check .
          uv run ty check src tests examples scripts
          uv run pytest --cov=bustan --cov-report=term-missing --cov-report=xml
          uv build
          uvx --from twine twine check dist/*

      - name: Publish to PyPI
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
