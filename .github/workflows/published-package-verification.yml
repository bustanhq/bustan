name: Published Package Verification

on:
  # Called by publish.yml once the upload succeeds. This is the path that actually runs
  # after a release cut by this repository: a release created by a workflow using the
  # default token raises no event that can start another workflow, so the trigger below
  # never fires for one. It stays because it is correct for a release a person creates by
  # hand, which does raise a startable event.
  workflow_call:
    inputs:
      version:
        description: Published package version to verify, for example 0.1.0
        required: true
        type: string
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Published package version to verify, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify Published Package
    runs-on: ubuntu-latest

    env:
      INPUT_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Resolve published version
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="$RELEASE_TAG"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "A version is required from the release tag or workflow input." >&2
            exit 1
          fi
          echo "BUSTAN_VERSION=$version" >> "$GITHUB_ENV"

      # PyPI does not serve a version to installers the moment the upload returns 200. The
      # upload commits to the index first and the installer-facing caches catch up behind
      # it, so a release can be complete and correct and still be unresolvable for a while.
      # This step therefore asks two questions and keeps their answers apart, because they
      # want opposite responses from a reader: an index that has not caught up is a wait,
      # and an upload that never happened is a failed release.
      #
      # The window is fifteen minutes, backing off from five seconds to a three-minute
      # ceiling, and two things pick that number. A release that was on PyPI within a
      # couple of minutes has been failed by a window of about seventy-five seconds, so
      # the tail is longer than a minute and a window worth trusting has to clear it by an
      # order of magnitude rather than by a margin. And the simple index is served with a
      # ten-minute max-age, so a window shorter than that can sit inside a single cached
      # answer and learn nothing at all by asking again. The cost is job minutes on a path
      # that runs once per release and blocks nothing; the cost of the alternative is a red
      # check on an action nobody can take back, which teaches the next person to stop
      # reading this job at the moment reading it matters most.
      #
      # Presence in the simple index is what separates the two failures, so it is read with
      # caching defeated: a cached index answers with the state before the upload, which
      # reads exactly like a release that never went out. pip is told not to cache either,
      # because otherwise the first attempt's answer is stored for the index's whole
      # max-age and every retry inside it is decided before it is made.
      #
      # Only the installation is retried. Everything after the loop runs once, so a longer
      # wait cannot turn a broken package into a passing one.
      - name: Verify pip install and console entry point
        run: |
          set -euo pipefail
          python -m venv .published-smoke
          . .published-smoke/bin/activate
          python -m pip install --upgrade pip
          python -u - "$BUSTAN_VERSION" <<'PY'
          """Wait for the published version to become installable, then install it."""

          import json
          import subprocess
          import sys
          import time
          import urllib.request

          PROJECT = "bustan"
          VERSION = sys.argv[1]
          SIMPLE_INDEX_URL = f"https://pypi.org/simple/{PROJECT}/"
          WINDOW_SECONDS = 900
          INDEX_GRACE_SECONDS = 120
          FIRST_DELAY_SECONDS = 5
          MAXIMUM_DELAY_SECONDS = 180


          def comparable(version_text):
              """Return a version without the separators a project may spell either way.

              Used only to choose a failure message. What counts as the right version is
              decided by pip resolving the pinned requirement, never by this.
              """
              return version_text.lower().replace("-", "").replace("_", "").replace(".", "")


          def names_a_file_for_this_version(text):
              """Whether the text names a distribution file belonging to this exact version.

              The trailing delimiter is the whole point: without it, 2.0.0 matches the
              filenames of 2.0.0rc5 and an upload that never happened is called published.
              """
              return f"{PROJECT}-{VERSION}-" in text or f"{PROJECT}-{VERSION}.tar.gz" in text


          def read_index():
              """Return the index's version list and whether it holds the wanted version.

              Read past every cache in the way: the unique query defeats the content
              delivery network and the headers defeat anything nearer, because a stale
              answer here is indistinguishable from an upload that never happened and
              would send a reader to re-cut a release that is already published.
              """
              request = urllib.request.Request(
                  f"{SIMPLE_INDEX_URL}?cache-bust={time.time_ns()}",
                  headers={
                      "Accept": "application/vnd.pypi.simple.v1+json",
                      "Cache-Control": "no-cache, no-store, max-age=0",
                      "Pragma": "no-cache",
                      # Named rather than left as the language default, because an index
                      # is entitled to treat an anonymous client differently and this
                      # one asks a handful of times per release.
                      "User-Agent": f"{PROJECT}-published-package-verification",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode("utf-8", "replace")
              try:
                  document = json.loads(body)
              except json.JSONDecodeError:
                  # Content negotiation gave us the HTML index instead. It lists the same
                  # filenames, and a filename is all the presence check needs.
                  return [], names_a_file_for_this_version(body)
              listed = sorted(str(entry) for entry in document.get("versions", ()))
              if any(comparable(entry) == comparable(VERSION) for entry in listed):
                  return listed, True
              filenames = " ".join(
                  str(entry.get("filename", "")) for entry in document.get("files", ())
              )
              return listed, names_a_file_for_this_version(filenames)


          def install():
              """Install the pinned version, with pip asking PyPI rather than its cache."""
              command = [sys.executable, "-m", "pip", "install", "--no-cache-dir"]
              installed = subprocess.run([*command, f"{PROJECT}=={VERSION}"], check=False)
              return installed.returncode == 0


          def fail(message):
              print(message, file=sys.stderr)
              raise SystemExit(1)


          def upload_never_arrived(elapsed, listed):
              known = ", ".join(listed) if listed else "no versions at all"
              return (
                  f"{PROJECT} {VERSION} is not in the PyPI simple index {elapsed}s after this "
                  f"job started, on an index read with caching defeated every time. The upload "
                  f"did not reach PyPI, so this is a failed release rather than propagation "
                  f"lag, and re-running this job will not change it. The index lists {known}."
              )


          def upload_arrived_but_install_failed(elapsed, attempts):
              return (
                  f"{PROJECT} {VERSION} is in the PyPI simple index, so the upload did reach "
                  f"PyPI and re-cutting this release would not help, but pip could not install "
                  f"it in {elapsed}s over {attempts} attempts. Either PyPI has not finished "
                  f"serving it to installers, or the installation itself is failing; the pip "
                  f"output above says which."
              )


          def index_unreadable(elapsed, attempts, error):
              return (
                  f"pip could not install {PROJECT} {VERSION} in {elapsed}s over {attempts} "
                  f"attempts, and the PyPI simple index could not be read to tell a missing "
                  f"upload from a slow one ({error}). This job cannot say which happened; read "
                  f"the index by hand before either trusting or re-cutting this release."
              )


          started = time.monotonic()
          delay = FIRST_DELAY_SECONDS
          attempts = 0
          seen_in_index = False
          listed = []
          error = None

          while True:
              attempts += 1
              if install():
                  print(f"{PROJECT}=={VERSION} installed on attempt {attempts}.")
                  break

              elapsed = round(time.monotonic() - started)
              try:
                  listed, present = read_index()
              except (OSError, ValueError) as read_error:
                  error, present = read_error, False
                  print(f"after {elapsed}s the simple index could not be read: {read_error}")
              else:
                  error = None
                  held = "lists" if present else "does not list"
                  print(f"after {elapsed}s the simple index {held} {PROJECT} {VERSION}")
              seen_in_index = seen_in_index or present

              if not seen_in_index and error is None and elapsed >= INDEX_GRACE_SECONDS:
                  # An index that answers, with caching defeated, and still does not list the
                  # version is evidence about the upload rather than about propagation: an
                  # upload that committed appears there within seconds. Failing here keeps a
                  # release that genuinely did not go out from taking the whole window to say
                  # so, and it is the only path that reaches this wording.
                  fail(upload_never_arrived(elapsed, listed))

              if elapsed + delay >= WINDOW_SECONDS:
                  if seen_in_index:
                      fail(upload_arrived_but_install_failed(elapsed, attempts))
                  # Not seen in the index this late means every probe since the grace period
                  # failed to read it, because a probe that answered and did not list the
                  # version exits above long before the window runs out.
                  fail(index_unreadable(elapsed, attempts, error))

              time.sleep(delay)
              delay = min(delay * 2, MAXIMUM_DELAY_SECONDS)
          PY
          # Everything below runs once, on the version pip resolved. Widening the wait must
          # not widen what counts as success, so these assert rather than print: a package
          # that installs but cannot be imported, or a console entry point that disagrees
          # with the package shipping it, still fails the job. The pinned requirement above
          # is what ties both readings to the version that was published, so comparing them
          # to each other here needs no second opinion about how a version is spelled.
          installed="$(python -c 'import bustan; print(bustan.__version__)')"
          reported="$(bustan --version)"
          if [ "$reported" != "bustan $installed" ]; then
            echo "bustan --version printed '$reported' where the package reports $installed" >&2
            exit 1
          fi
          echo "import bustan reports $installed, and '$reported' agrees"
          bustan --help

      # Presence is not the claim a release makes about "bustan init". The claim is that
      # a project it scaffolds works, and the only way to know that is to run the tests
      # the scaffolder just wrote, from the published artifact, with nothing installed
      # beyond what the scaffolder itself asked for.
      - name: Verify scaffolding from published artifact
        run: |
          # The runner's default shell is bash -e: it stops on a failing command, but it
          # expands an unset variable to nothing, so a version that never resolved would
          # scaffold against whatever the index happens to serve. nounset is what fails
          # that here, and pipefail is kept so that a pipeline added below cannot hide a
          # failure behind the last command's exit status.
          set -euo pipefail
          # The distribution under test is named once, here. Everything a scaffolded
          # project needs is read back out of what the scaffolder declared, so no
          # dependency of one is named in this workflow and none can drift from it.
          distribution=bustan
          cli_smoke_root="$(mktemp -d)"
          mkdir "$cli_smoke_root/smoke-app"
          cd "$cli_smoke_root/smoke-app"
          uv init --package .
          # Refreshed for this package only, for the same reason the step above tells pip
          # not to cache: uv's cache of the index can be older than the release being
          # verified, and a cached index that predates the upload fails a healthy release
          # here just as readily as it does there. Only this project's entry is refreshed,
          # so every other download in this step still comes from the cache.
          uv add --refresh-package "$distribution" "${distribution}==${BUSTAN_VERSION}"
          uv run bustan init
          # The file assertions stay. They are cheap, and when the scaffolder writes
          # nothing at all they name the missing file, which a collection error reports
          # far less clearly.
          test -f "$cli_smoke_root/smoke-app/pyproject.toml"
          test -f "$cli_smoke_root/smoke-app/README.md"
          test -f "$cli_smoke_root/smoke-app/src/smoke_app/__init__.py"
          test -f "$cli_smoke_root/smoke-app/src/smoke_app/app_main.py"
          test -f "$cli_smoke_root/smoke-app/src/smoke_app/app_module.py"
          test -f "$cli_smoke_root/smoke-app/src/smoke_app/app_controller.py"
          test -f "$cli_smoke_root/smoke-app/src/smoke_app/app_service.py"
          test -f "$cli_smoke_root/smoke-app/tests/smoke_app/test_app_controller.py"
          test -f "$cli_smoke_root/smoke-app/tests/smoke_app/test_app_service.py"
          test -f "$cli_smoke_root/smoke-app/tests/smoke_app/test_app_module.py"
          # Both entries resolve through app_main rather than through the package itself,
          # which is why the module above is required: a project created by
          # "uv init --package" already carries an __init__.py holding a main that prints,
          # and the scaffolder keeps a file that is already there.
          grep -q 'start = "smoke_app.app_main:main"' "$cli_smoke_root/smoke-app/pyproject.toml"
          grep -q 'dev = "smoke_app.app_main:dev"' "$cli_smoke_root/smoke-app/pyproject.toml"
          # No dependency below is chosen here. The scaffolder declares what a scaffolded
          # project needs in the manifest rather than printing a command to run, so the
          # runtime requirement is read back out of the manifest it wrote and the tools
          # the scaffolded tests need are the dev group it declared, which "uv sync"
          # installs. A manifest this step cannot read a requirement out of fails the job
          # rather than falling back to a list that may be years old.
          #
          # The requirement is read even though a version is already installed above,
          # because the manifest is where the scaffolder names the extras a scaffolded
          # project needs and the pinned install above carries none of them. Only the name
          # and the extras are taken: the bound is whatever the project already carried,
          # and this job verifies one version, so what the scaffold asked for is pinned to
          # the version under test instead.
          runtime_requirement="$(python - "$distribution" pyproject.toml <<'PY'
          """Print what a manifest asks of one distribution: its name and its extras."""

          import re
          import sys
          import tomllib

          distribution, manifest_path = sys.argv[1], sys.argv[2]

          # A declaration is read as an installer reads it: the name lowered and its
          # separators folded, so a manifest spelling this distribution with a capital or
          # with another separator still names it, and the extras taken as written with
          # everything after them dropped.
          SEPARATORS = re.compile(r"[-_.]+")
          NAME = r"[A-Za-z0-9](?:[A-Za-z0-9._-]*[A-Za-z0-9])?"
          DECLARATION = re.compile(rf"\s*({NAME})\s*(\[[^]]*\])?")


          def folded(name):
              return SEPARATORS.sub("-", name.strip().lower())


          with open(manifest_path, "rb") as manifest_file:
              project = tomllib.load(manifest_file).get("project")
          declared = project.get("dependencies") if isinstance(project, dict) else None
          declared = declared if isinstance(declared, list) else []

          for entry in declared:
              match = DECLARATION.match(str(entry))
              if match is None or folded(match.group(1)) != folded(distribution):
                  continue
              print(match.group(1) + re.sub(r"\s+", "", match.group(2) or ""))
              break
          else:
              raise SystemExit(
                  f"the scaffolded {manifest_path} declares no {distribution} requirement "
                  f"under [project] dependencies, so this step cannot install the version "
                  f"under test with the extras a scaffolded project needs. It declares "
                  f"{declared}."
              )
          PY
          )"
          uv add --refresh-package "$distribution" "${runtime_requirement}==${BUSTAN_VERSION}"
          # The one command the scaffolder prints as the next thing to run, so the dev
          # group reaches the environment without a tool in it being named here.
          uv sync
          uv run pytest
