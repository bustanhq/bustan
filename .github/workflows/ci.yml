name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Before any `uv run`, which re-locks the project as a side effect and would
      # repair a stale lockfile in place before this step could see it.
      - name: Check lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Check API reference drift
        run: uv run python scripts/generate_api_reference.py --check

      - name: Check markdown links
        run: uv run python scripts/check_markdown_links.py

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff
        run: uv run ruff check .

      - name: Ty
        run: uv run ty check src tests scripts

      # The threshold lives here rather than in pyproject.toml so that a targeted
      # local run of one test file is not judged against whole-repository coverage.
      - name: Pytest with coverage
        run: uv run pytest --cov=bustan --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      # Runs even when the step above fails, which is now a thing that happens.
      # A contributor chasing a coverage regression needs this report most on the
      # run that rejected them.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  coverage-core:
    name: Coverage (bustan.kernel)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # Gated on its own because whole-repository coverage lets the injection
      # kernel hide behind well-tested peripheral code. Branch coverage is on for
      # every run via [tool.coverage.run] in pyproject.toml.
      - name: Pytest with coverage of the injection kernel
        run: uv run pytest --cov=bustan.kernel --cov-report=term-missing --cov-fail-under=85

  layering:
    name: Package layering (advisory)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # Advisory only, and only until the violations it already reports are fixed. The check
      # passes on a tree that respects the layer table; this tree does not yet, and the imports
      # it names are defects to close rather than entries to add to the table. Delete
      # `continue-on-error` the moment the report is empty: an advisory layering check that
      # stays advisory is a layering check nobody reads.
      - name: Check package layering
        id: layering
        continue-on-error: true
        run: |
          status=0
          uv run python scripts/check_layering.py --check > layering-report.txt || status=$?
          cat layering-report.txt
          exit "$status"

      # The report belongs on the run summary rather than only inside a step log, because a
      # step whose failure does not stop the job is a step nobody opens. The job is green
      # whether the report is empty or not, so nothing in the checks list can announce the day
      # it empties; the summary says so instead, on the first run where it becomes true.
      - name: Summarise the layering report
        env:
          LAYERING_OUTCOME: ${{ steps.layering.outcome }}
        run: |
          if [ "$LAYERING_OUTCOME" = "failure" ]; then
            {
              echo '### Package layering: advisory failure'
              echo
              echo 'These imports cross a boundary declared in `scripts/check_layering.py`.'
              echo
              echo '```'
              cat layering-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Package layering: clean'
              echo
              echo 'The report is empty. Delete `continue-on-error` from the step above so this'
              echo 'job blocks a change that reintroduces a violation.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  conformance:
    name: Adapter conformance matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # Blocking, unlike the advisory jobs around it, because this one passes on the tree
      # as it stands: every adapter answers every case in the suite, and answers it the
      # same way. A failure here is therefore a regression in the abstraction that a
      # change just introduced, not a debt inherited from before the check existed. The
      # script's docstring states exactly what "the same way" compares.
      - name: Run the adapter conformance matrix
        run: uv run python scripts/conformance_matrix.py

  audit-repros:
    name: Audit repro harness (advisory)
    runs-on: ubuntu-latest
    # Advisory only. The harness reports defects this branch has not fixed yet, so
    # a red result here is a signal and must not block a merge. It becomes a
    # blocking gate once the harness is expected to report zero reproductions.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run audit repro harness
        run: uv run python docs/audits/di-container-2026-09/run_repros.py

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Exported from the committed lockfiles rather than resolved afresh, so the audit
      # reads what a checkout actually installs. All seven are exported, not just the
      # root: each example is a standalone uv project whose lockfile resolves its own
      # versions, and those already differ from the root's, so a root-only audit would
      # miss an advisory that only the examples carry. `bustan` itself is dropped because
      # the examples depend on it by path, which has no release to hold an advisory.
      # A failed export is a broken lockfile, not a finding, so this step blocks.
      - name: Export the resolved dependency sets
        run: |
          mkdir -p dependency-audit
          for project in . examples/*/; do
            case "$project" in
              .) name=root ;;
              *) name="$(basename "$project")" ;;
            esac
            uv export --frozen --no-emit-project --no-emit-package bustan \
              --all-groups --format requirements-txt \
              --project "$project" --output-file "dependency-audit/$name.requirements.txt" \
              --quiet
          done

      # Advisory, not blocking, and deliberately so. An advisory is published against a
      # version this repository already depends on; it is not introduced by the pull
      # request that happens to be open on the day it lands. Blocking would hand an
      # upstream disclosure to whoever pushes next as a red build, and the fix - raise the
      # floor, relock - does not belong inside their unrelated change. The finding goes to
      # the run summary instead, and `docs/RELEASE_CHECKLIST.md` makes reading that summary
      # a release step, which is the point at which acting on it is somebody's job. The
      # layering step above takes the same shape for the same reason.
      - name: Audit the resolved dependency sets
        id: audit
        continue-on-error: true
        run: |
          status=0
          : > audit-report.txt
          for requirements in dependency-audit/*.requirements.txt; do
            name="$(basename "$requirements" .requirements.txt)"
            echo "=== $name" >> audit-report.txt
            if uvx pip-audit --requirement "$requirements" --disable-pip --format columns \
                 > findings.txt 2> findings.err; then
              echo "No known vulnerabilities." >> audit-report.txt
            else
              status=1
              if [ -s findings.txt ]; then
                # Identical rows are collapsed because the advisory service reports one
                # advisory once per alias it carries, and a reader needs the advisory, the
                # package and the fixed version once each, not a count inflated by aliases.
                awk '!seen[$0]++' findings.txt >> audit-report.txt
              else
                cat findings.err >> audit-report.txt
              fi
            fi
            echo >> audit-report.txt
          done
          cat audit-report.txt
          exit "$status"

      # The report belongs on the run summary rather than only inside a step log, because a
      # step whose failure does not stop the job is a step nobody opens. The clean report is
      # written too: the release checklist asks for the audit's result, and "nothing found in
      # these seven lockfiles" is that result, where a green checks list alone is not.
      - name: Summarise the dependency audit
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" = "failure" ]; then
            {
              echo '### Dependency audit: advisory finding'
              echo
              echo 'A package resolved by a committed lockfile has a known advisory. Raise the'
              echo 'floor past the fixed version and relock, in its own pull request.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Dependency audit: clean'
              echo
              echo 'No advisory matches any package the committed lockfiles resolve to.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo '```'
            cat audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  supported-platforms:
    name: Supported Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Pytest
        run: uv run pytest

  examples:
    name: Example Execution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Each example is a standalone uv project that depends on the root project by
      # path, so the root's own metadata - including its dev-dependency-group
      # specifiers - is recorded in every example lockfile, and a root dependency
      # edit makes all six stale. Checked before the example run below, because that
      # run re-locks each example in place and would repair the drift unseen.
      - name: Check example lockfiles are current
        run: |
          for manifest in examples/*/pyproject.toml; do
            project="$(dirname "$manifest")"
            echo "Checking $project/uv.lock"
            uv lock --check --project "$project"
          done

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run checked-in examples
        run: uv run python scripts/run_examples.py

  package:
    name: Package Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx --from twine twine check dist/*

      - name: Smoke install wheel
        run: uv run python scripts/package_smoke_check.py
