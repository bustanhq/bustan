name: CI

on:
  pull_request:
  push:
  # Manual only, for the benchmark job's baseline capture. Every other job behaves the
  # same on a dispatch as on a push; the capture step is the one that checks the event.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Before any `uv run`, which re-locks the project as a side effect and would
      # repair a stale lockfile in place before this step could see it.
      - name: Check lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Check API reference drift
        run: uv run python scripts/generate_api_reference.py --check

      - name: Check markdown links
        run: uv run python scripts/check_markdown_links.py

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff
        run: uv run ruff check .

      - name: Ty
        run: uv run ty check src tests scripts

      # The threshold lives here rather than in pyproject.toml so that a targeted
      # local run of one test file is not judged against whole-repository coverage.
      - name: Pytest with coverage
        run: uv run pytest --cov=bustan --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      # Runs even when the step above fails, which is now a thing that happens.
      # A contributor chasing a coverage regression needs this report most on the
      # run that rejected them.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  coverage-core:
    name: Coverage (bustan.kernel)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # Gated on its own because whole-repository coverage lets the injection
      # kernel hide behind well-tested peripheral code. Branch coverage is on for
      # every run via [tool.coverage.run] in pyproject.toml.
      - name: Pytest with coverage of the injection kernel
        run: uv run pytest --cov=bustan.kernel --cov-report=term-missing --cov-fail-under=85

  layering:
    name: Package layering
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # Blocking, because the tree respects the layer table and a report that is not empty is
      # therefore an edge the change under review just added. The report is written to a file
      # as well as to the log so the summary step below can quote it after this step has
      # stopped the job.
      - name: Check package layering
        id: layering
        run: |
          status=0
          uv run python scripts/check_layering.py --check > layering-report.txt || status=$?
          cat layering-report.txt
          exit "$status"

      # Runs even when the step above fails, which is the run that needs it: the reader has a
      # red job and wants the crossed boundary, not a step log to open. The clean report is
      # written too, because "no package crosses a layer" is a result the release checklist
      # asks for, and a green checks list alone does not say it.
      - name: Summarise the layering report
        if: always()
        env:
          LAYERING_OUTCOME: ${{ steps.layering.outcome }}
        run: |
          case "$LAYERING_OUTCOME" in
            failure)
              {
                echo '### Package layering: violation'
                echo
                echo 'These imports cross a boundary declared in `scripts/check_layering.py`.'
                echo 'They are defects to close, not entries to add to the table.'
                echo
                echo '```'
                cat layering-report.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            success)
              {
                echo '### Package layering: clean'
                echo
                echo 'Every top-level package under `src/bustan` is declared, and no import'
                echo 'crosses a layer the wrong way.'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              {
                echo '### Package layering: did not run'
                echo
                echo 'An earlier step failed, so the tree was never checked.'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

  conformance:
    name: Adapter conformance matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # Blocking, unlike the advisory jobs around it, because this one passes on the tree
      # as it stands: every adapter answers every case in the suite, and answers it the
      # same way. A failure here is therefore a regression in the abstraction that a
      # change just introduced, not a debt inherited from before the check existed. The
      # script's docstring states exactly what "the same way" compares.
      - name: Run the adapter conformance matrix
        run: uv run python scripts/conformance_matrix.py

  audit-repros:
    name: Audit repro harness
    runs-on: ubuntu-latest
    # A regression gate. Every finding the audit demonstrated is fixed, and each one
    # is held there by the script that used to reproduce it, so a reproduction here
    # is a defect coming back rather than one not addressed yet. `--expect-fixed` is
    # what makes the job fail on one: without it the runner exits zero on a
    # reproduction and reports it in the summary alone.

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run audit repro harness
        run: uv run python docs/audits/di-container-2026-09/run_repros.py --expect-fixed

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Exported from the committed lockfiles rather than resolved afresh, so the audit
      # reads what a checkout actually installs. All seven are exported, not just the
      # root: each example is a standalone uv project whose lockfile resolves its own
      # versions, and those already differ from the root's, so a root-only audit would
      # miss an advisory that only the examples carry. `bustan` itself is dropped because
      # the examples depend on it by path, which has no release to hold an advisory.
      # A failed export is a broken lockfile, not a finding, so this step blocks.
      - name: Export the resolved dependency sets
        run: |
          mkdir -p dependency-audit
          for project in . examples/*/; do
            case "$project" in
              .) name=root ;;
              *) name="$(basename "$project")" ;;
            esac
            uv export --frozen --no-emit-project --no-emit-package bustan \
              --all-groups --format requirements-txt \
              --project "$project" --output-file "dependency-audit/$name.requirements.txt" \
              --quiet
          done

      # Advisory, not blocking, and deliberately so. An advisory is published against a
      # version this repository already depends on; it is not introduced by the pull
      # request that happens to be open on the day it lands. Blocking would hand an
      # upstream disclosure to whoever pushes next as a red build, and the fix - raise the
      # floor, relock - does not belong inside their unrelated change. The finding goes to
      # the run summary instead, and `docs/RELEASE_CHECKLIST.md` makes reading that summary
      # a release step, which is the point at which acting on it is somebody's job. This is
      # the last advisory step in the workflow, and it is advisory because the finding
      # arrives from outside the repository rather than out of the diff.
      - name: Audit the resolved dependency sets
        id: audit
        continue-on-error: true
        run: |
          status=0
          : > audit-report.txt
          for requirements in dependency-audit/*.requirements.txt; do
            name="$(basename "$requirements" .requirements.txt)"
            echo "=== $name" >> audit-report.txt
            if uvx pip-audit --requirement "$requirements" --disable-pip --format columns \
                 > findings.txt 2> findings.err; then
              echo "No known vulnerabilities." >> audit-report.txt
            else
              status=1
              if [ -s findings.txt ]; then
                # Identical rows are collapsed because the advisory service reports one
                # advisory once per alias it carries, and a reader needs the advisory, the
                # package and the fixed version once each, not a count inflated by aliases.
                awk '!seen[$0]++' findings.txt >> audit-report.txt
              else
                cat findings.err >> audit-report.txt
              fi
            fi
            echo >> audit-report.txt
          done
          cat audit-report.txt
          exit "$status"

      # The report belongs on the run summary rather than only inside a step log, because a
      # step whose failure does not stop the job is a step nobody opens. The clean report is
      # written too: the release checklist asks for the audit's result, and "nothing found in
      # these seven lockfiles" is that result, where a green checks list alone is not.
      - name: Summarise the dependency audit
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" = "failure" ]; then
            {
              echo '### Dependency audit: advisory finding'
              echo
              echo 'A package resolved by a committed lockfile has a known advisory. Raise the'
              echo 'floor past the fixed version and relock, in its own pull request.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Dependency audit: clean'
              echo
              echo 'No advisory matches any package the committed lockfiles resolve to.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo '```'
            cat audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  supported-platforms:
    name: Supported Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Pytest
        run: uv run pytest

  examples:
    name: Example Execution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Each example is a standalone uv project that depends on the root project by
      # path, so the root's own metadata - including its dev-dependency-group
      # specifiers - is recorded in every example lockfile, and a root dependency
      # edit makes all six stale. Checked before the example run below, because that
      # run re-locks each example in place and would repair the drift unseen.
      - name: Check example lockfiles are current
        run: |
          for manifest in examples/*/pyproject.toml; do
            project="$(dirname "$manifest")"
            echo "Checking $project/uv.lock"
            uv lock --check --project "$project"
          done

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # Each example ships its own test file, and until this job ran it, nothing did:
      # the root suite's testpaths stop at `tests/`. The script runs each example's
      # application and then that example's suite, and fails a suite that collects
      # nothing, so an example whose tests stop being collected is a red build rather
      # than a silently shorter log.
      - name: Run checked-in examples and their own test suites
        run: |
          set -o pipefail
          uv run python scripts/run_examples.py | tee example-report.txt

      # On the run summary as well as in the step log, because the collected count per
      # example is the number that says the suites are still being run at all, and a
      # number nobody reads is a number nobody notices going to zero.
      - name: Summarise the example run
        if: always()
        run: |
          {
            echo '### Examples'
            echo
            echo '```'
            tail -n 20 example-report.txt 2>/dev/null \
              || echo 'The examples did not run. An earlier step failed.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx --from twine twine check dist/*

      - name: Smoke install wheel
        run: uv run python scripts/package_smoke_check.py

  benchmarks:
    name: Benchmarks and regression gate
    runs-on: ubuntu-latest

    # Pinned because dictionary layout follows the hash seed and the request path is
    # dictionaries, so an unpinned seed costs several percent of run-to-run spread that
    # the gate's threshold would otherwise have to absorb. The baseline records the seed
    # it was captured under and the gate says so when a run disagrees.
    env:
      PYTHONHASHSEED: "0"

    # The benchmark suite is a standalone uv project with its own lockfile, kept out of
    # the root one so that a benchmark-only dependency cannot invalidate what any other
    # project in this repository resolves.
    defaults:
      run:
        working-directory: benchmarks

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Before any `uv run`, which re-locks the project as a side effect and would
      # repair a stale lockfile in place before this step could see it. This project
      # depends on the root one by path, so the root's own metadata is recorded here and
      # a root dependency edit makes this lockfile stale the way it makes the example
      # lockfiles stale. Regenerate it with `uv lock` in `benchmarks/`.
      - name: Check the benchmark lockfile is current
        run: uv lock --check

      - name: Install the benchmark project
        run: uv sync --frozen

      # Two passes. The gate takes the lower ratio each benchmark reached, so a single
      # pass that shared a runner with a noisy neighbour cannot fail the build alone.
      # Measurement settings are in benchmarks/pyproject.toml rather than here, because
      # a run under different settings is not comparable with the baseline and there
      # would be no way to tell that from the numbers.
      - name: Run the benchmark suite (first pass)
        run: |
          mkdir -p .benchmark-results
          uv run pytest --benchmark-json=.benchmark-results/pass-1.json

      - name: Run the benchmark suite (second pass)
        run: uv run pytest --benchmark-json=.benchmark-results/pass-2.json

      # Blocking. Every measurement is divided by the calibration workload measured in
      # the same run, so what is compared against the baseline is a ratio and the speed
      # of whichever runner this landed on cancels out.
      - name: Compare against the published baseline
        run: |
          uv run python gate.py \
            --result .benchmark-results/pass-1.json \
            --result .benchmark-results/pass-2.json | tee gate-report.txt

      # On the run summary as well as in the step log, because a number nobody reads is
      # a number nobody notices drifting. Written whether the gate passed or failed: the
      # margin a passing run had is what says whether the threshold is still the right
      # one.
      - name: Summarise the regression gate
        if: always()
        run: |
          {
            echo '### Benchmark regression gate'
            echo
            echo '```'
            cat gate-report.txt 2>/dev/null || echo 'The gate did not run. An earlier step failed.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A baseline is captured on the runner class the gate runs on, so this step is how a
      # new one is produced: dispatch the workflow, read the baseline it prints, commit
      # that. It is skipped on every other event because it costs eight further passes and
      # a baseline is moved deliberately, not on each push. It runs after the gate so that
      # overwriting baseline.json in the workspace cannot affect the verdict above.
      - name: Capture a baseline on this runner
        if: github.event_name == 'workflow_dispatch'
        run: |
          for pass in 3 4 5 6 7 8 9 10; do
            uv run pytest -q --benchmark-json=".benchmark-results/capture-$pass.json" > /dev/null
          done
          uv run python gate.py --write-baseline \
            --result .benchmark-results/capture-3.json \
            --result .benchmark-results/capture-4.json \
            --result .benchmark-results/capture-5.json \
            --result .benchmark-results/capture-6.json \
            --result .benchmark-results/capture-7.json \
            --result .benchmark-results/capture-8.json \
            --result .benchmark-results/capture-9.json \
            --result .benchmark-results/capture-10.json | tee capture-report.txt
          {
            echo '### Baseline captured on this runner'
            echo
            echo 'Commit this as `benchmarks/baseline.json`. The spread table below is the'
            echo 'evidence its threshold has to be chosen against.'
            echo
            echo '```json'
            cat baseline.json
            echo '```'
            echo
            echo '```'
            cat capture-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # include-hidden-files, because the results directory is dot-prefixed to keep it out
      # of the way locally and this action skips hidden paths by default.
      - name: Upload the benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/.benchmark-results/
          include-hidden-files: true
