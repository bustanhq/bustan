[project]
name = "bustan"
version = "2.0.0"
description = "Enterprise API Framework for Python"
keywords = [
    "api",
    "asgi",
    "dependency injection",
    "di",
    "framework",
    "openapi",
    "pydantic",
    "starlette",
    "typed",
    "web framework",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "mosesgameli", email = "mosesgameli20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.13.0,<5.0.0",
    "pydantic>=2.13.3,<3",
    "starlette>=1.0.0,<2.0.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[project.scripts]
bustan = "bustan.cli.main:main"

[project.urls]
Homepage = "https://bustan.dev"
Documentation = "https://bustan.dev"
Repository = "https://github.com/bustanhq/bustan"
Changelog = "https://github.com/bustanhq/bustan/blob/main/CHANGELOG.md"
Issues = "https://github.com/bustanhq/bustan/issues"
Support = "https://github.com/bustanhq/bustan/issues"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "lefthook>=2.1.4",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.15.12,<0.17.0",
    "ty",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bustan"]
# The scaffolder's templates are text, not source: three of them hold a $package_name
# placeholder and are not parseable Python until it is substituted. They became visible
# to coverage when the template directories stopped being namespace packages, and a run
# that prints three parse warnings every time is a run whose warnings stop being read.
omit = ["src/bustan/cli/templates/*"]

[tool.coverage.report]
# No fail_under here: the threshold lives on the CI command line so that a targeted
# local run of a single test file is not judged against whole-repository coverage.
# precision must stay >= 1, or a total below the threshold rounds up to meet it.
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "src/bustan/cli/templates",
    "docs/audits/di-container-2026-09/repros/evidence",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[build-system]
requires = ["uv_build>=0.11.8,<0.13.0"]
build-backend = "uv_build"

[tool.ty]

[tool.ty.src]
exclude = ["src/bustan/cli/templates/**", "examples/**"]
