[project]
name = "bustan"
version = "2.0.0rc7"
description = "Enterprise API Framework for Python"
keywords = [
    "api",
    "asgi",
    "dependency injection",
    "di",
    "framework",
    "openapi",
    "pydantic",
    "starlette",
    "typed",
    "web framework",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "mosesgameli", email = "mosesgameli20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.13.0,<5.0.0",
    "pydantic>=2.13.3,<3",
]

# Serving HTTP needs a transport, and which transport is the application's choice. The
# Starlette adapter is the one this package ships, so its dependencies are named here
# rather than in the runtime set: installing bustan installs no web server, and an
# application that wants the shipped adapter asks for it by name.
#
# python-multipart is not optional within this extra. Starlette refuses every form body,
# urlencoded as well as multipart, unless it is installed, so without it a route binding
# UploadedFile or UploadedFiles answers 500 on this adapter and 200 on the raw ASGI one,
# which parses forms itself. The framework offers one binding surface, so the adapter it
# ships has to serve all of it.
[project.optional-dependencies]
starlette = [
    "python-multipart>=0.0.20,<1.0.0",
    "starlette>=1.3.1,<2.0.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[project.scripts]
bustan = "bustan.cli.main:main"

[project.urls]
Homepage = "https://bustan.dev"
Documentation = "https://bustan.dev"
Repository = "https://github.com/bustanhq/bustan"
Changelog = "https://github.com/bustanhq/bustan/blob/main/CHANGELOG.md"
Issues = "https://github.com/bustanhq/bustan/issues"
Support = "https://github.com/bustanhq/bustan/issues"

[dependency-groups]
# The suite exercises the shipped Starlette adapter, so the development environment
# installs the extra. The claim that the package installs without a web server is
# proven by scripts/package_smoke_check.py in a clean environment, not by this one.
dev = [
    "bustan[starlette]",
    "httpx>=0.28.1,<1.0.0",
    "lefthook>=2.1.4",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.15.12,<0.17.0",
    "ty",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bustan"]
# The scaffolder's templates are text, not source: three of them hold a $package_name
# placeholder and are not parseable Python until it is substituted. They became visible
# to coverage when the template directories stopped being namespace packages, and a run
# that prints three parse warnings every time is a run whose warnings stop being read.
omit = ["src/bustan/cli/templates/*"]

[tool.coverage.report]
# No fail_under here: the threshold lives on the CI command line so that a targeted
# local run of a single test file is not judged against whole-repository coverage.
# precision must stay >= 1, or a total below the threshold rounds up to meet it.
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "src/bustan/cli/templates",
    # The audit evidence scripts are kept exactly as they ran, so they are neither
    # linted nor formatted: a fix would change what a script measures, and two of the
    # findings cannot be satisfied at all without deleting the behaviour on record.
    # This entry is the only suppression the scripts have; none of them carries a
    # file-level noqa, so adding one back would split one decision across two places.
    "docs/audits/di-container-2026-09/repros/evidence",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[build-system]
requires = ["uv_build>=0.11.8,<0.13.0"]
build-backend = "uv_build"

[tool.ty]

[tool.ty.src]
exclude = ["src/bustan/cli/templates/**", "examples/**"]
